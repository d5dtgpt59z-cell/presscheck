name: Optical systems validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y build-essential curl xz-utils tesseract-ocr fonts-dejavu-core
      - name: Cache pinned Ghostscript test engine
        uses: actions/cache@v4
        with:
          path: work/ghostscript-ci/runtime
          key: ghostscript-c20492bc8ebb96c87fa2e52a0926e1cda8cde95d66145e018ac713fed5da38cf-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build_test_ghostscript.sh') }}
      - name: Build and verify Ghostscript 10.08.0 with test-only ICC
        run: bash scripts/build_test_ghostscript.sh
      - run: pip install -r requirements.txt
      - name: Test backend with the real pinned PDF converter
        run: |
          PYTHONPATH=backend python -m pytest backend/tests -q --junitxml=/tmp/presscheck-backend-tests.xml
          python - <<'PYTEST_CHECK'
          from xml.etree import ElementTree as ET
          report = ET.parse('/tmp/presscheck-backend-tests.xml')
          converter = [case for case in report.iter('testcase') if 'test_production_pdf' in case.get('classname', '')]
          assert converter, 'No production PDF converter tests were collected'
          skipped = [case.get('name') for case in converter if case.find('skipped') is not None]
          assert not skipped, 'Production PDF tests must run with the pinned engine and fixture: ' + str(skipped)
          print('Production PDF tests executed without skips:', len(converter))
          PYTEST_CHECK
      - name: Validate production workspace helpers
        run: node --test tests/*.test.mjs
        working-directory: frontend
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start real services
        run: |
          PYTHONPATH=backend uvicorn presscheck.api:app --host 127.0.0.1 --port 8000 > /tmp/presscheck-api.log 2>&1 &
          cd frontend
          npm start > /tmp/presscheck-console.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/api/health && break || sleep 1; done
      - run: npm run test:e2e
        working-directory: frontend
      - run: PYTHONPATH=backend python scripts/benchmark.py
      - run: pip-audit && npm --prefix frontend audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-evidence
          path: |
            docs/benchmark-results.json
            docs/e2e-results.json
            docs/console*.png
            frontend/test-results
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d
      - name: Verify PostgreSQL-backed inspection through console proxy
        run: |
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:3000/api/health && break || sleep 2; done
          python scripts/container_smoke.py
      - if: always()
        run: docker compose logs && docker compose down -v
