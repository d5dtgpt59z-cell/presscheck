name: Optical systems validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr fonts-dejavu-core
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=backend python -m pytest backend/tests -q
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start real services
        run: |
          PYTHONPATH=backend uvicorn presscheck.api:app --host 127.0.0.1 --port 8000 > /tmp/presscheck-api.log 2>&1 &
          cd frontend
          npm start > /tmp/presscheck-console.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/api/health && break || sleep 1; done
      - run: npm run test:e2e
        working-directory: frontend
      - run: PYTHONPATH=backend python scripts/benchmark.py
      - run: pip-audit && npm --prefix frontend audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-evidence
          path: |
            docs/benchmark-results.json
            docs/e2e-results.json
            docs/console*.png
            frontend/test-results
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d
      - name: Verify PostgreSQL-backed inspection through console proxy
        run: |
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:3000/api/health && break || sleep 2; done
          python scripts/container_smoke.py
      - if: always()
        run: docker compose logs && docker compose down -v
