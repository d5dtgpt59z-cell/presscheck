services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: presscheck
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: presscheck
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U presscheck"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://presscheck:localdev@postgres:5432/presscheck
      PRESSCHECK_DATA: /data
      VISION_BASE_URL: ${VISION_BASE_URL:-https://api.openai.com/v1}
      VISION_MODEL: ${VISION_MODEL:-gpt-4.1-mini}
      VISION_API_KEY: ${VISION_API_KEY:-}
    volumes:
      - artwork:/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 2g
    cpus: 2
    security_opt:
      - no-new-privileges:true
  console:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      BACKEND_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
volumes:
  database:
  artwork:
